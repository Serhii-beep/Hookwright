name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Verify formatting
        run: dotnet format Hookwright.slnx --verify-no-changes
  
  migrations:
    name: Migrations (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [Sqlite, PostgreSql]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Restore
        run: dotnet restore Hookwright.slnx
      
      - name: Restore tools
        run: dotnet tool restore
      
      - name: Verify migrations match the model
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Hookwright.${{ matrix.provider }}
          --startup-project tests/Hookwright.${{ matrix.provider }}.Tests
  
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
            test-args: '--filter-not-trait "Requires=Docker" --ignore-exit-code 8'
    
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-
      
      - name: Restore
        run: dotnet restore Hookwright.slnx
      
      - name: Build
        run: dotnet build Hookwright.slnx --no-restore --configuration Release
      
      - name: Test
        run: >
          dotnet test Hookwright.slnx
          --no-build
          --configuration Release
          --report-trx
          --coverage
          --coverage-output-format cobertura
          --results-directory ${{ github.workspace }}/artifacts/test-results
          ${{ matrix.test-args }}
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: error
  
  vulnerabilities:
    name: Vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      
      - name: Check for vulnerable packages
        run: |
          dotnet restore Hookwright.slnx
          output=$(dotnet list Hookwright.slnx package --vulnerable --include-transitive)
          echo "$output"
          if echo "$output" | grep -q "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected."
            exit 1
          fi